# Nixpacks configuration for Railway deployment
#
# nixPkgs:
#   - python3, postgresql_16.dev, gcc: required for building the app
#   - stdenv.cc.cc.lib: provides libstdc++.so.6 for pandas/numpy C extensions
#
# LD_LIBRARY_PATH:
#   nixpacks installs packages via `nix-env -i` which links everything into
#   ~/.nix-profile. Setting LD_LIBRARY_PATH to /root/.nix-profile/lib makes
#   libstdc++.so.6 findable at runtime without hardcoding a nix store hash.

[phases.setup]
nixPkgs = ["python3", "postgresql_16.dev", "gcc", "stdenv.cc.cc.lib"]

[variables]
LD_LIBRARY_PATH = "/root/.nix-profile/lib"
