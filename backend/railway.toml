# WTLL Platform — Railway Deployment Configuration
# Backend: Django + Gunicorn
# Database: Neon PostgreSQL (set DATABASE_URL in Railway environment variables)
#
# Setup steps:
#   1. Create a new Railway project
#   2. Add a service pointing to this repo with Root Directory = backend
#   3. Railway will auto-detect this file
#   4. Set environment variables (see .env.example):
#        SECRET_KEY, DEBUG, DATABASE_URL, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS, GOOGLE_MAPS_API_KEY
#   5. The DATABASE_URL comes from Neon — copy the "pooled" connection string from the Neon dashboard

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --no-input"

[deploy]
startCommand = "bash -c 'export LD_LIBRARY_PATH=$(find /nix/store -maxdepth 5 -name libstdc++.so.6 -exec dirname {} \\; 2>/dev/null | head -1):$LD_LIBRARY_PATH && python manage.py migrate --no-input && exec gunicorn wtll.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120'"
healthcheckPath = "/api/settings/public/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
